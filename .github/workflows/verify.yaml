name: Verify Settings

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  parse:
    name: Parse Setupfile
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check Setupfile exists
        run: test -f Setupfile

      - name: Check install.sh exists and is executable
        run: test -x scripts/install.sh

      - name: Parse Setupfile (installers mocked — no software installed)
        run: |
          brew()    { echo "[OK] brew $*"; }
          git()     { echo "[OK] git $*"; }
          curl()    { echo "[OK] curl $*"; }
          python3() { echo "[OK] python3 $*"; }
          pod()     { echo "[OK] pod $*"; }
          export -f brew git curl python3 pod
          output=$(bash scripts/install.sh Setupfile 2>&1)
          echo "$output"
          if echo "$output" | grep -q "^Error:"; then
            echo "FAIL: Error lines found in output" >&2
            exit 1
          fi
          if echo "$output" | grep -q "^Warning:"; then
            echo "FAIL: Warning lines found in output" >&2
            exit 1
          fi
          echo "Parse smoke test passed."

      - name: Check Makefile has expected targets
        run: |
          for target in all preferences _bootstrap _install _configure; do
            if grep -q "^${target}:" Makefile; then
              echo "[OK] target '${target}' found"
            else
              echo "FAIL: target '${target}' not found in Makefile" >&2
              exit 1
            fi
          done
          echo "Makefile target check passed."
